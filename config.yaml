steps:
  - name: "Nico mix"
    operations:
      - type: "cut"
        id: "toctoc"
        input: "/output/toctoc.m4a"
        start: "00:00:00.500"
        end: "00:00:02"

      - type: "cut"
        id: "quiestla-cut"
        input: "/output/quiestla.m4a"
        start: "00:00:00.500"
        end: "00:00:02"

      - type: "cut"
        id: "nico-cut1"
        name: "Nico excerpt"
        input: "/output/Nico.mp3"
        start: "00:00:00.680"
        end: "00:00:00.800"

      - type: "cut"
        id: "nico-cut2"
        name: "Nico excerpt"
        input: "/output/Nico.mp3"
        start: "00:00:00.600"
        end: "00:00:02"

      - type: "cut"
        id: "liqui-cut"
        name: "Liqui excerpt"
        input: "/output/liqui.m4a"
        start: "00:00:00.720"
        end: "00:00:02"

      - type: "concatenate"
        name: "Concatenate Nico mix"
        inputs:
          - { id: "toctoc" }
          - { id: "quiestla-cut" }
          - { id: "nico-cut1" }
          - { id: "liqui-cut" }
          - { id: "nico-cut2" }
        mode: "copy"
        output: "nico-mix.mp3"
